<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Hub Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="header-logo">
            <img src="Logo.jpg" alt="Student Hub Portal Logo" width="100">
        </div>
        <div class="header-title">
            <h1>STUDENT HUB PORTAL</h1>
            <p>Your Gateway to Academic Information</p>
        </div>
    </header>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <main class="registration-container">

        <h2>Student Registration</h2>

        <form id="registrationForm" action="login.html" method="get">

            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" autocomplete="name" required>
                <small id="fullnameError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
                <small id="emailError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" name="mobile" inputmode="numeric"
                       autocomplete="tel" pattern="[6-9][0-9]{9}"
                       title="Enter a valid 10-digit Indian mobile number" required>
                <small id="mobileError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="userid">User ID:</label>
                <input type="text" id="userid" name="userid" autocomplete="username" required>
                <small id="useridError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       autocomplete="new-password" minlength="8" required>
                <small id="passwordStrength" aria-live="polite"></small>
                <small id="passwordError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="confirmpassword">Confirm Password:</label>
                <input type="password" id="confirmpassword" name="confirmpassword"
                       autocomplete="new-password" required>
                <small id="confirmPasswordError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="course">Course:</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                </select>
                <small id="courseError" class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="year">Academic Year:</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="First Year">First Year</option>
                    <option value="Second Year">Second Year</option>
                    <option value="Third Year">Third Year</option>
                    <option value="Fourth Year">Fourth Year</option>
                </select>
                <small id="yearError" class="error-message"></small>
            </div>

            <fieldset class="form-group">
                <legend>Gender:</legend>

                <label>
                    <input type="radio" name="gender" value="Male" required>
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>

                <small id="genderError" class="error-message"></small>
            </fieldset>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" name="terms" required>
                    I accept the Terms and Conditions.
                </label>
                <small id="termsError" class="error-message"></small>
            </div>

            <button type="submit" class="button">Register</button>

        </form>

        <p>Already Registered? <a href="login.html">Login Here</a></p>

    </main>

    <footer class="footer">
        <p>© 2026 Student Hub Portal</p>
        <p>Designed for Student Academic Support</p>
    </footer>

</body>

</html>
