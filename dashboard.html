
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Student Hub Portal</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <table width="80%" align="center">
            <tr>
                <td width="120" align="center">
                    <img src="Logo.jpg"
                         alt="Student Hub Portal Logo"
                         width="90">
                </td>

                <td align="center">
                    <h1>STUDENT HUB PORTAL</h1>
                </td>
            </tr>
        </table>

        <hr width="80%">

    </header>

    <!-- Navigation -->
    <nav>
        <center>
            <table class="nav"
                   border="1"
                   cellpadding="10"
                   cellspacing="0"
                   width="70%">

                <tr align="center">
                    <td><a href="index.html">Home</a></td>
                    <td><a href="about.html">About Us</a></td>
                    <td><a href="contact.html">Contact Us</a></td>
                    <td><a href="profile.html">Profile</a></td>
                    <td><a href="login.html">Logout</a></td>
                </tr>

            </table>
        </center>
    </nav>

    <br><br>

    <!-- Main Dashboard -->
    <main>
        <section class="dashboard-section">

            <center>
                <h2>Student Dashboard</h2>

                <table class="dashboard-table"
                       border="1"
                       cellpadding="20"
                       cellspacing="15">

                    <!-- First Row -->
                    <tr>

                        <td class="attendance" width="250">
                            <h3>Student Attendance</h3>

                            <br>

                            <a href="attendance.html">
                                <button type="button">
                                    View Attendance
                                </button>
                            </a>
                        </td>

                        <td class="fees" width="250">
                            <h3>Student Fees Details</h3>

                            <br>

                            <a href="fees.html">
                                <button type="button">
                                    View Fees
                                </button>
                            </a>
                        </td>

                    </tr>

                    <!-- Second Row -->
                    <tr>

                        <td class="timetable" width="250">
                            <h3>Time Table</h3>

                            <br>

                            <a href="timetable.html">
                                <button type="button">
                                    View Time Table
                                </button>
                            </a>
                        </td>

                        <td class="result" width="250">
                            <h3>Results</h3>

                            <br>

                            <a href="result.html">
                                <button type="button">
                                    View Results
                                </button>
                            </a>
                        </td>

                    </tr>

                </table>

                <br><br>

                <a href="index.html">
                    <button type="button">Back to Home</button>
                </a>

            </center>

        </section>
    </main>

    <br><br>

    <!-- Footer -->
    <footer class="footer">

        <hr width="80%">

        <center>
            <p>© 2026 Student Hub Portal | All Rights Reserved</p>
        </center>

    </footer>

</body>

</html>
